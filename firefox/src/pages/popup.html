<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TouchLock – Fingerprint Browser Lock</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <img src="../../icons/icon.svg" width="28" height="28" alt="TouchLock">
      </div>
      <h1>TouchLock</h1>
    </header>

    <!-- Status -->
    <div id="status-section">
      <div class="status-badge" id="status-badge">
        <span class="dot"></span>
        <span class="label">Checking…</span>
      </div>
    </div>

    <!-- Not configured -->
    <div id="setup-needed" class="section hidden">
      <p class="muted">Extension is not configured yet.</p>
      <button id="btn-setup" class="btn btn-primary">Open Setup</button>
    </div>

    <!-- Actions (when configured) -->
    <div id="actions" class="section hidden">
      <button id="btn-lock" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Lock Now
      </button>
      <button id="btn-settings" class="btn btn-ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </button>
    </div>

    <!-- Promo banner (rotating) -->
    <a class="promo-banner" id="promo-banner" href="#" target="_blank" rel="noopener">
      <span class="promo-icon" id="promo-icon"><img class="promo-logo hidden" id="promo-logo" width="20" height="20" alt=""></span>
      <span class="promo-body">
        <span class="promo-name" id="promo-name"></span>
        <span class="promo-desc" id="promo-desc"></span>
      </span>
      <span class="promo-cta">Try it &rarr;</span>
    </a>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <a href="https://coindrop.to/mathinraj" target="_blank" rel="noopener" class="bar-item" title="Buy me a coffee">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        <span>Support</span>
      </a>
      <a href="https://github.com/mathinraj/TouchLock/issues" target="_blank" rel="noopener" class="bar-item" title="Report a bug">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Bug</span>
      </a>
      <button class="bar-item" id="btn-whats-new" title="What's New">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12v10H4V12"/>
          <path d="M2 7h20v5H2z"/>
          <path d="M12 22V7"/>
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
        </svg>
        <span>New</span>
      </button>
      <a href="https://mathinraj.is-a.dev/" target="_blank" rel="noopener" class="bar-item" title="Developer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        <span>Developer</span>
      </a>
    </div>
  </div>

  <script src="../scripts/popup.js"></script>
</body>
</html>
